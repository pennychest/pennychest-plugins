name: Release a plugin

# Pushing a tag such as hsbc-v0.2.0 releases that plugin: it's built for WASI and packaged,
# the package is attached to a GitHub release, and plugins.json on main points at it, so
# PennyChest offers the new version in Settings > Plugins.

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - name: Package
        id: package
        run: |
          tag=${GITHUB_REF_NAME}
          name=${tag%-v*}
          version=${tag##*-v}
          entry=$(EXPECTED_VERSION="$version" tools/package.sh "$name")
          echo "$entry"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$(echo "$entry" | python3 -c 'import json,sys; print(json.load(sys.stdin)["file"])')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$entry" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha256"])')" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' "${{ steps.package.outputs.name }}/CHANGELOG.md" | tail -n +2)
          gh release create "$GITHUB_REF_NAME" "dist/${{ steps.package.outputs.file }}" \
            --title "${{ steps.package.outputs.name }} ${{ steps.package.outputs.version }}" \
            --notes "$notes"
      - name: Point plugins.json at it
        run: |
          git fetch origin main
          git checkout main
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.package.outputs.file }}"
          python3 tools/update_index.py "${{ steps.package.outputs.name }}" \
            "${{ steps.package.outputs.version }}" "$url" "${{ steps.package.outputs.sha256 }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "🔖 ${{ steps.package.outputs.name }} ${{ steps.package.outputs.version }} in plugins.json"
          git push origin main
