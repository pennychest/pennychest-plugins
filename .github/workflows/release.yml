name: Release

# Merging is the release, as in PennyChest, but per plugin: each plugin whose
# commits since its last tag warrant a version (by the same gitmoji as
# PennyChest's .cz.toml) gets its version bumped, a changelog entry and a
# <plugin>-v<version> tag. See .github/scripts/release.py.
#
# It pushes as the release GitHub App rather than with GITHUB_TOKEN, because
# only an app can be let past the ruleset on main.
on:
  push:
    branches: [main]

concurrency:
  # Not cancel-in-progress: a half-finished release leaves tags with no
  # GitHub release.
  group: release

jobs:
  release:
    name: Bump, tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # everything that writes uses the app's token

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # each plugin's history back to its last tag
          token: ${{ steps.app-token.outputs.token }}   # so the push is the app's

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bump each plugin whose commits warrant a version
        id: bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Commit as the app's bot user, so the commit is linked to it.
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          python .github/scripts/release.py "$RUNNER_TEMP/notes"

      - name: Push the tags and publish the GitHub releases
        if: steps.bump.outputs.tags != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAGS: ${{ steps.bump.outputs.tags }}
        run: |
          set -euo pipefail
          refs=()
          for tag in $TAGS; do refs+=("refs/tags/$tag"); done
          # Atomic, so the bump commit never lands without its tags.
          git push --atomic origin HEAD:main "${refs[@]}"

          for tag in $TAGS; do
            gh release create "$tag" --verify-tag \
              --title "${tag%-v*} v${tag##*-v}" --notes-file "$RUNNER_TEMP/notes/$tag.md"
            { echo "## $tag"; echo; cat "$RUNNER_TEMP/notes/$tag.md"; } >> "$GITHUB_STEP_SUMMARY"
          done
