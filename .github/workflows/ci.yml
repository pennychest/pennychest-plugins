name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml: the version, rustfmt, clippy and the WASI target.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - name: Every plugin builds for WASI
        run: cargo build --release --locked --target wasm32-wasip1
      - name: plugins.json lists installable plugins
        run: python3 -c "import json; i = json.load(open('plugins.json')); assert 'plugins' in i"
