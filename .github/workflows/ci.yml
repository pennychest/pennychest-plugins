name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: PennyChest branch, tag or commit to test against
        default: main

permissions:
  contents: read

env:
  # The PennyChest repository the plugins are tested against; set the CORE_REPOSITORY
  # variable to test against another copy of it
  CORE_REPOSITORY: ${{ vars.CORE_REPOSITORY || 'pennychest/pennychest' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [hsbc]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ inputs.core_ref || 'main' }}
          path: pennychest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pennychest/backend/pyproject.toml
            ${{ matrix.plugin }}/pyproject.toml
      - run: pip install -e pennychest/backend -e "${{ matrix.plugin }}[dev]"
      - run: ruff check ${{ matrix.plugin }}
      - run: python -m pytest -q ${{ matrix.plugin }}/tests
