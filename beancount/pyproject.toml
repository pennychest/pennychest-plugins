[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pennychest-beancount"
version = "0.1.0"
description = "PennyChest exporter for Beancount's plain-text ledger format, for Fava and bean-query"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "pennychest",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.2.0",
]

[project.entry-points."pennychest.exporters"]
beancount = "pennychest_beancount.exporter:BeancountExporter"

[project.urls]
Source = "https://github.com/pennychest/pennychest-plugins/tree/main/beancount"

[tool.setuptools]
packages = ["pennychest_beancount"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
